<svg width="250" height="100" viewBox="0 0 250 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="250" height="100" fill="black"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="50%" stop-color="gray"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
  </defs>

  <!-- Text -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="50" font-weight="bold"
        fill="url(#textGradient)" text-anchor="middle" alignment-baseline="middle">
    &lt;CH/&gt;
  </text>
</svg>